<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>
 
   <h1>Cadastro de Alunos</h1> 
   <form>
Nome Completo:<input type="text" size="60">
<br><br>
Data de Nascimento: <input type="date">
<br><br>

Cidade:
<select>
    <option>Acopiara</option>
    <option>Piquet Carneiro</option>
    <option>Iguatu</option>
    <option>Irapuan Pinheiro</option>
    <option>Mombaça</option>
</select>
<br>
<br>
Curso:
<br>
<input type="radio" name="curso"> Admistração
<br>
<input type="radio" name="curso"> Desenvolvimento de Sistemas
<br>
<input type="radio" name="curso"> Enfermagem
<br>
<input type="radio"  name="curso"> Informática

<br><br>
Hobbies:
<br>
<input type="checkbox"> Volei
<br>
<input type="checkbox"> Futsal
<br>
<input type="checkbox"> Programar
<br>
<input type="checkbox"> Tênis de Mesa
<br>


   </form>

</body>
</html>
