<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
</head>
<body>
    <h1>Cadastro de Empresa</h1>
    <form>
        <label>Nome da Empresa:</label><br>
        <input type="text"
name="empresa"><br><br>
        <label>CNPJ:</label><br>
        <input type="text" name="cnpj"><br><br>
        <label>Nome do Responsável:</label><br>

        <input type="text"
    name="responsavel"><br><br>
        <label>E-mail:</label><br>

        <input type="email"
    name="email"><br><br>

        <label>Telefone:</label><br>

        <input type="tel"
    name="telefone"><br><br>
    
        <label>Endereço:</label><br>

        <input type="text"
    name="endereco"><br><br>

        <label>Cidade:</label>

        <input type="text"
    name="cidade"><br><br>

        <label>Estado:</label><br>

        <select name="estado">
            <option>Ceará</option>
            <option>Pernambuco</option>
            <option>Paraíba</option>
            <option>Rio Grande do Norte</option>
            <option>Piauí</option>
        </select><br><br>
        <label>Tipo de Empresa:</label><br>

        <input type="radio" name="tipo"
    value="comercio">
        Comércio<br>
 
        <input type="radio" name="tipo"
    value="servico">

        Serviços<br>

        <input type="radio" name="tipo"
    valeu="industria">

        Industria<br><br>
        <label>Áreas de Atuação</label><br>

        <input type="checkbox" name="area"
    value="tecnologia">
         Tecnologia<br>

         <input type="checkbox" name="area"
    value="venda">

    Vendas<br>

        <input type="checkbox" name="area"
    value="administracao">
    
    Admistração<br><br>
     
    <label>Observações</label><br>

    <textarea name="observacoes" rows="5"
cols="40"></textarea><br><br>

     <input type="submit" value="Cadastrar">

     <input type="reset" value="Limpar">
    </form>
</body>
</html>
